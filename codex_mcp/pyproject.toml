[project]
name = "codex-mcp"
version = "0.1.0"
description = "MCP server wrapping Codex CLI for Claude Code"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0,<3",
]

[project.scripts]
codex-mcp = "codex_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
